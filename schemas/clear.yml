          nullable: true
        planning_structure_with_type:
          type: string
          nullable: true
        planning_structure_type:
          type: string
          nullable: true
        planning_structure_type_full:
          type: string
          nullable: true
        planning_structure:
          type: string
          nullable: true

        street_fias_id:
          type: string
          nullable: true
        street_kladr_id:
          type: string
          nullable: true
        street_with_type:
          type: string
          nullable: true
        street_type:
          type: string
          nullable: true
        street_type_full:
