        beltway_hit:
          type: string
          nullable: true
          enum:
            - IN_MKAD
            - OUT_MKAD
            - IN_KAD
            - OUT_KAD
            - null
        beltway_distance:
          type: string
          nullable: true

        qc_geo:
          type: integer
          format: int32
          nullable: true
        qc_complete:
          type: integer
