          nullable: true

        entrance:
          type: string
          nullable: true
        floor:
          type: string
          nullable: true

        flat_fias_id:
          type: string
          nullable: true
        flat_cadnum:
          type: string
          nullable: true
        flat_type:
          type: string
          nullable: true
        flat_type_full:
          type: string
          nullable: true
        flat:
