openapi: 3.0.3

info:
  title: Dadata Cleaner API
  version: v1

servers:
  - url: https://cleaner.dadata.ru
    description: Main cleaner server.

security:
  - DadataAuthorization: []
    DadataSecret: []

paths:
  /api/v1/clean/address:
    post:
      operationId: cleanAddress
      tags: [Cleaner]
      summary: Стандартизация адреса
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean/name:
    post:
      operationId: cleanName
      tags: [Cleaner]
      summary: Стандартизация ФИО
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Name"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean/phone:
    post:
      operationId: cleanPhone
      tags: [Cleaner]
      summary: Стандартизация телефона
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Phone"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean/email:
    post:
      operationId: cleanEmail
      tags: [Cleaner]
      summary: Стандартизация email
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Email"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean/birthdate:
    post:
      operationId: cleanBirthdate
      tags: [Cleaner]
      summary: Стандартизация даты рождения
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Birthdate"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean/passport:
    post:
      operationId: cleanPassport
      tags: [Cleaner]
      summary: Стандартизация паспорта
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passport"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean/vehicle:
    post:
      operationId: cleanVehicle
      tags: [Cleaner]
      summary: Стандартизация автомобиля
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean/as_is:
    post:
      operationId: cleanAsIs
      tags: [Cleaner]
      summary: Возврат значения без стандартизации
      requestBody:
        $ref: "#/components/requestBodies/CleanStringArrayRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AsIs"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/clean:
    post:
      operationId: cleanRecord
      tags: [Cleaner]
      summary: Стандартизация составных записей
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordString"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEntity"
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    DadataAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: 'Формат: Token ${API_KEY}'
    DadataSecret:
      type: apiKey
      in: header
      name: X-Secret

  requestBodies:
    CleanStringArrayRequest:
      required: true
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            items:
              type: string
          examples:
            address:
              value:
                - "москва сухонская 11"

  responses:
    ErrorResponse:
      description: Ошибка API DaData
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DadataError"

  schemas:
    DadataError:
      type: object
      properties:
        family:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    RecordStructureType:
      type: string
      enum:
        - NAME
        - ADDRESS
        - PHONE
        - AS_IS
        - BIRTHDATE
        - EMAIL
        - VEHICLE
        - PASSPORT

    RecordString:
      type: object
      required:
        - structure
        - data
      properties:
        structure:
          type: array
          items:
            $ref: "#/components/schemas/RecordStructureType"
        data:
          type: array
          items:
            type: array
            items:
              type: string

    RecordEntity:
      type: object
      properties:
        structure:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RecordStructureType"
        data:
          type: array
          nullable: true
          items:
            type: array
            items:
              anyOf:
                - $ref: "#/components/schemas/Address"
                - $ref: "#/components/schemas/Name"
                - $ref: "#/components/schemas/Phone"
                - $ref: "#/components/schemas/Email"
                - $ref: "#/components/schemas/Birthdate"
                - $ref: "#/components/schemas/Passport"
                - $ref: "#/components/schemas/Vehicle"
                - $ref: "#/components/schemas/AsIs"

    Address:
      type: object
      properties:
        source:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        country_iso_code:
          type: string
          nullable: true
        federal_district:
          type: string
          nullable: true

        region_fias_id:
          type: string
          nullable: true
        region_kladr_id:
          type: string
          nullable: true
        region_iso_code:
          type: string
          nullable: true
        region_with_type:
          type: string
          nullable: true
        region_type:
          type: string
          nullable: true
        region_type_full:
          type: string
          nullable: true
        region:
          type: string
          nullable: true

        area_fias_id:
          type: string
          nullable: true
        area_kladr_id:
          type: string
          nullable: true
        area_with_type:
          type: string
          nullable: true
        area_type:
          type: string
          nullable: true
        area_type_full:
          type: string
          nullable: true
        area:
          type: string
          nullable: true

        city_fias_id:
          type: string
          nullable: true
        city_kladr_id:
          type: string
          nullable: true
        city_with_type:
          type: string
          nullable: true
        city_type:
          type: string
          nullable: true
        city_type_full:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        city_area:
          type: string
          nullable: true

        city_district_fias_id:
          type: string
          nullable: true
        city_district_kladr_id:
          type: string
          nullable: true
        city_district_with_type:
          type: string
          nullable: true
        city_district_type:
          type: string
          nullable: true
        city_district_type_full:
          type: string
          nullable: true
        city_district:
          type: string
          nullable: true

        settlement_fias_id:
          type: string
          nullable: true
        settlement_kladr_id:
          type: string
          nullable: true
        settlement_with_type:
          type: string
