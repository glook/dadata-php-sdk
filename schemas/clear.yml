          nullable: true
        qc:
          type: integer
          format: int32
          nullable: true

        unparsed_parts:
          type: string
          nullable: true

        metro:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Metro"

        divisions:
          $ref: "#/components/schemas/AddressDivisions"

    AddressDivisions:
      type: object
      nullable: true
      properties:
        administrative:
          $ref: "#/components/schemas/AdministrativeDivision"

    AdministrativeDivision:
      type: object
      nullable: true
      properties:
        area:
          $ref: "#/components/schemas/AddressPart"
        city:
          $ref: "#/components/schemas/AddressPart"
        city_district:
